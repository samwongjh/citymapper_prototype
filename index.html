    <script>
      // Catch and isolate cross-origin third-party script errors (e.g. Disqus iframe sandbox / tracking protection)
      window.addEventListener('error', function(event) {
        if (!event) return;
        var msg = (event.message || '').toString();
        var filename = (event.filename || '').toString();
        var isDisqus = filename.indexOf('disqus') !== -1 || (event.target && event.target.src && event.target.src.indexOf('disqus') !== -1);
        if (msg === 'Script error.' || isDisqus || msg.indexOf('disqus') !== -1) {
          if (event.preventDefault) event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        if (!event) return;
        var reason = (event.reason && (event.reason.message || event.reason.stack || event.reason)).toString();
        if (reason.indexOf('disqus') !== -1 || reason.indexOf('Script error') !== -1) {
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      });
    </script>
